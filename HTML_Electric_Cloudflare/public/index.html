<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Machine V4</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f8;color:#153047;font:16px/1.6 Segoe UI,Arial}header{background:#132d42;color:white;padding:28px max(24px,6vw)}header small{color:#bdd4df}main{max-width:1200px;margin:auto;padding:36px 24px}h1{margin:0;font-size:32px}input{width:100%;max-width:520px;padding:14px;border:1px solid #bdcdd7;border-radius:9px;font:inherit}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;margin-top:26px}.card{background:white;border:1px solid #d6e2e9;border-radius:14px;padding:26px}.card h2{margin:10px 0}.badge{background:#e2f2ed;color:#146b57;padding:4px 9px;border-radius:5px;font-size:13px}p,small{color:#597083}a{display:inline-block;background:#176397;color:white;padding:10px 20px;border-radius:7px;text-decoration:none;margin-top:12px}footer{margin-top:36px;font-size:13px;color:#597083}</style></head><body><header><h1>All Machine</h1><small>V4 · Thư viện kỹ thuật máy</small></header><main><h2>Chọn máy để tra cứu</h2><p>Mỗi model có bộ tài liệu, sơ đồ và dữ liệu tìm kiếm riêng.</p><input id="filter" placeholder="Tìm model hoặc bộ điều khiển…" aria-label="Tìm máy"><div id="cards" class="cards"></div><footer id="count"></footer></main><script src="catalog.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=document.querySelector('#filter').value.toLowerCase();const all=window.MACHINE_CATALOG||[];const list=all.filter(m=>(m.name+' '+m.controller).toLowerCase().includes(q));document.querySelector('#cards').innerHTML=list.map(m=>{if(!/^machines\/[A-Za-z0-9_-]+\/index\.html$/.test(m.entry))return '';return `<article class="card"><span class="badge">${esc(m.controller)} · v${esc(m.version)}</span><h2>${esc(m.name)}</h2><p>${esc(m.description)}</p><p>${m.systems} hệ thống · ${m.blocks} khối · ${m.pages} trang</p><small>Nguồn: ${esc(m.source)}</small><br><a href="${esc(m.entry)}">Mở máy →</a></article>`}).join('')||'<p>Không tìm thấy model.</p>';document.querySelector('#count').textContent=list.length+' / '+all.length+' model';}
document.querySelector('#filter').addEventListener('input',render);render();
// Preserve previously shared F3 links.
function redirectLegacy(){if(/^#(block\/|system\/|find\/|machine\/F3\/|home$)/.test(location.hash))location.replace('machines/F3/index.html'+location.hash);}
window.addEventListener('hashchange',redirectLegacy);redirectLegacy();
</script></body></html>
